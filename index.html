<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PB SINAR PAGI | Sistem Keuangan Profesional</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1e3a8a; --bg: #f8fafc; --text: #1e293b; --accent: #ef4444; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 1400px; margin: auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .auth-bar { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px; gap: 10px; }
        
        /* Dashboard Ringkasan */
        .summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { padding: 20px; border-radius: 12px; background: #f8fafc; border: 1px solid #e2e8f0; }
        .card-val { font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-top: 5px; }
        
        /* Tabel */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f1f5f9; padding: 14px; border: 1px solid #e2e8f0; font-size: 0.75rem; text-transform: uppercase; color: #475569; }
        td { padding: 12px; border: 1px solid #e2e8f0; text-align: center; }
        tr:nth-child(even) { background: #fcfcfc; }
        tr:hover { background: #f1f5f9; }
        
        /* Fitur Aksi */
        .admin-only { display: none !important; }
        .admin-mode .admin-only { display: table-cell !important; }
        .btn { padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.75rem; font-weight: 600; margin: 2px; }
        .edit { background: #dbeafe; color: #1e40af; }
        .hapus { background: #fee2e2; color: #b91c1c; }
        .bg-saldo { font-weight: 700; color: #5b21b6; background: #f5f3ff; }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="auth-bar">
        <span id="userStatus" style="margin-right:auto; font-weight:600;">Status: Pengunjung</span>
        <button id="btnLogin" onclick="prosesLogin()">Login Admin</button>
        <button id="btnLogout" style="display:none" onclick="logoutAdmin()">Logout</button>
    </div>

    <header style="text-align:center; margin-bottom:30px;">
        <h1>PB SINAR PAGI KABUPATEN BONE</h1>
        <p>Sistem Keuangan & Buku Kas Umum 2026</p>
    </header>

    <div class="summary-cards">
        <div class="card"><div>Saldo Lalu</div><div class="card-val" id="valLalu">Rp 550.000</div></div>
        <div class="card"><div>Total Pemasukan</div><div class="card-val" id="valMasuk">Rp 0</div></div>
        <div class="card"><div>Total Pengeluaran</div><div class="card-val" id="valKeluar">Rp 0</div></div>
        <div class="card"><div>Saldo Akhir</div><div class="card-val" id="valSaldo">Rp 0</div></div>
    </div>

    <table id="tabelKas">
        <thead>
            <tr>
                <th>NO</th><th>Tanggal</th><th>URAIAN</th>
                <th>PEMASUKAN</th><th>PENGELUARAN</th>
                <th>SALDO KUMULATIF</th>
                <th>KET.</th><th class="admin-only">AKSI</th>
            </tr>
        </thead>
        <tbody id="kasTableBody"></tbody>
    </table>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCMjG9thg1hLv7fjZjvRvPicg4rDyWPCaE",
        databaseURL: "https://pb-sinar-pagi-default-rtdb.firebaseio.com",
        projectId: "pb-sinar-pagi"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let isAdmin = false;
    let transaksiKas = [];
    let saldoAwal = 550000;

    // Load Data
    db.ref('keuangan').on('value', (snap) => {
        let data = snap.val();
        transaksiKas = data ? (data.transaksiKas || []) : [];
        renderTable();
    });

    function renderTable() {
        const tbody = document.getElementById('kasTableBody');
        tbody.innerHTML = '';
        let currentSaldo = saldoAwal;
        let totalIn = 0; let totalOut = 0;

        transaksiKas.forEach((t, index) => {
            let isMasuk = t.kategori.startsWith('in_');
            currentSaldo += isMasuk ? t.nominal : -t.nominal;
            if(isMasuk) totalIn += t.nominal; else totalOut += t.nominal;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${t.tanggal}</td>
                <td style="text-align:left">${t.uraian}</td>
                <td style="color:green">${isMasuk ? 'Rp ' + t.nominal.toLocaleString() : '-'}</td>
                <td style="color:red">${!isMasuk ? 'Rp ' + t.nominal.toLocaleString() : '-'}</td>
                <td class="bg-saldo">Rp ${currentSaldo.toLocaleString()}</td>
                <td><input value="${t.ket || ''}" style="border:none; background:transparent; width:100%; text-align:center;" onchange="updateKet(${index}, this.value)" ${isAdmin ? '' : 'disabled'}></td>
                <td class="admin-only">
                    <button class="btn edit" onclick="editData(${index})">Edit</button>
                    <button class="btn hapus" onclick="hapusData(${index})">Hapus</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('valMasuk').innerText = 'Rp ' + totalIn.toLocaleString();
        document.getElementById('valKeluar').innerText = 'Rp ' + totalOut.toLocaleString();
        document.getElementById('valSaldo').innerText = 'Rp ' + currentSaldo.toLocaleString();
    }

    function editData(index) {
        let n = prompt("Nominal Baru:", transaksiKas[index].nominal);
        let u = prompt("Uraian Baru:", transaksiKas[index].uraian);
        if(n && u) {
            transaksiKas[index].nominal = parseInt(n);
            transaksiKas[index].uraian = u;
            save();
        }
    }

    function hapusData(index) {
        if(confirm("Hapus transaksi ini?")) {
            transaksiKas.splice(index, 1);
            save();
        }
    }

    function save() {
        db.ref('keuangan').set({ transaksiKas: transaksiKas });
        renderTable();
    }

    function prosesLogin() {
        if(prompt("Password Admin:") === "Admin@2026") {
            isAdmin = true;
            document.getElementById('mainContainer').classList.add('admin-mode');
            document.getElementById('btnLogin').style.display = 'none';
            document.getElementById('btnLogout').style.display = 'inline-block';
            document.getElementById('userStatus').innerText = "Status: Admin";
        }
    }

    function logoutAdmin() {
        isAdmin = false;
        document.getElementById('mainContainer').classList.remove('admin-mode');
        document.getElementById('btnLogin').style.display = 'inline-block';
        document.getElementById('btnLogout').style.display = 'none';
        document.getElementById('userStatus').innerText = "Status: Pengunjung";
    }
</script>
</body>
</html>
