<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sistem Keuangan PB SINAR PAGI KABUPATEN BONE 2026</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        /* ... (CSS ASLI ANDA DITAMBAH STYLING PROFESIONAL) ... */
        :root { --primary: #1e3a8a; --accent: #ef4444; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); padding: 20px; }
        .container { max-width: 1600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { border: 1px solid #cbd5e1; padding: 10px 8px; text-align: center; }
        tbody tr:nth-child(even) { background-color: #fcfcfc; }
        .btn-edit { background: #3b82f6; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
        .btn-hapus { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
        .admin-only { display: none; }
        .admin-mode .admin-only { display: table-cell; }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <!-- Auth Bar & Nav Tabs tetap sama -->
    <div class="auth-bar">
        <button id="btnLogin" onclick="openLoginModal()">Login Admin</button>
        <button id="btnLogout" style="display:none" onclick="logoutAdmin()">Logout</button>
    </div>

    <div id="kas" class="tab-content active">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>NO</th><th>Tanggal</th><th>URAIAN</th>
                        <th>PEMASUKAN</th><th>PENGELUARAN</th>
                        <th>SALDO KUMULATIF</th> <!-- Kolom Baru -->
                        <th>KET</th><th class="admin-only">AKSI</th>
                    </tr>
                </thead>
                <tbody id="kasTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // ... (KONFIGURASI FIREBASE ANDA SAMA) ...
    const firebaseConfig = { /* isi config Anda */ };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let isAdminLoggedIn = false;
    let transaksiKas = [];
    const saldoSebelumnyaKas = { saldo: 550000 }; // Sesuai data Anda

    function renderBukuKas() {
        const tbody = document.getElementById('kasTableBody');
        tbody.innerHTML = '';
        
        let currentSaldo = saldoSebelumnyaKas.saldo;

        transaksiKas.forEach((t, index) => {
            // Logika Kumulatif
            let nominal = t.nominal || 0;
            let isMasuk = t.kategori.startsWith('in_');
            currentSaldo += isMasuk ? nominal : -nominal;

            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${t.tanggal}</td>
                <td class="text-left">${t.uraian}</td>
                <td style="color:green">${isMasuk ? 'Rp ' + nominal.toLocaleString() : '-'}</td>
                <td style="color:red">${!isMasuk ? 'Rp ' + nominal.toLocaleString() : '-'}</td>
                <td style="font-weight:bold">Rp ${currentSaldo.toLocaleString()}</td>
                <td><input type="text" value="${t.ket || ''}" onchange="updateKetKas(${index}, this.value)"></td>
                <td class="admin-only">
                    <button class="btn-edit" onclick="editTransaksi(${index})">Edit</button>
                    <button class="btn-hapus" onclick="hapusKas(${index})">Hapus</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function editTransaksi(index) {
        if (!isAdminLoggedIn) return;
        let t = transaksiKas[index];
        let newNominal = prompt("Ubah Nominal:", t.nominal);
        let newUraian = prompt("Ubah Uraian:", t.uraian);
        if (newNominal && newUraian) {
            transaksiKas[index].nominal = parseInt(newNominal);
            transaksiKas[index].uraian = newUraian;
            // Panggil fungsi simpan ke firebase Anda
            simpanKeCloud(); 
            renderBukuKas();
        }
    }

    // ... (FUNGSI LAINNYA TETAP SAMA) ...
</script>
</body>
</html>
